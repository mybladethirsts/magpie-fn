name: Build magpie-fn images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. 0.1.1121-9-fn1); default latest"
        required: false
        default: ""
  push:
    branches: [main, feat/tunnel]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER="latest"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/${{ github.repository_owner }}/magpie-fn:$VER,ghcr.io/${{ github.repository_owner }}/magpie-fn:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
